[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-inference-control-plane"
version = "0.1.0"
description = "Private local model discovery, serving, diagnostics, and benchmarking"
requires-python = ">=3.13,<3.14"
dependencies = [
  "certifi>=2026.7.22,<2027",
  "mlx==0.32.3",
  "mlx-lm==0.32.0",
  "mlx-vlm==0.7.4",
  "psutil>=5.9,<8",
  "questionary>=2,<3",
  "requests>=2,<3",
  "rich>=13,<15",
  "tiktoken>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
llm = "llm:main"
local-ai = "llm:main"

[tool.setuptools]
py-modules = ["llm"]

[tool.pytest.ini_options]
testpaths = ["evals", "webgui"]
